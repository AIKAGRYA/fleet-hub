<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0e14">
<title>Fleet Hub</title>
<style>
:root{
  --bg:#0d0e14;--card:#13151c;--ink:#d4cfc4;--mute:#5a5548;--line:rgba(255,255,255,.06);
  --ok:#5fa87a;--bad:#c44a3c;--acc:#5a8ac4;--me:rgba(95,168,122,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:15px}
body{display:flex;flex-direction:column}
button,input,textarea{font:inherit;color:inherit}
.gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.gatebox{width:min(360px,100%);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.gatebox h1{font-size:20px;margin-bottom:6px}
.gatebox p{color:var(--mute);font-size:13px;margin-bottom:14px}
.gatebox input{width:100%;background:#1a1c24;border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.gatebox button{width:100%;background:var(--ok);color:#0d0e14;border:0;border-radius:8px;padding:12px;font-weight:700}
.app{display:none;flex:1;min-height:0}
.side{width:220px;border-right:1px solid var(--line);overflow-y:auto;background:#0a0b10;padding-bottom:72px}
.side h1{font-size:16px;padding:14px;border-bottom:1px solid var(--line)}
.nav button,.nav .sec{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;padding:10px 14px;color:var(--ink)}
.nav .sec{font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;padding:12px 14px 4px}
.nav button.on{background:#13151c;border-left:2px solid var(--ok)}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:rgba(255,255,255,.12)}
.dot.live{background:var(--ok)}
.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar b{font-size:15px}
.cd{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;background:var(--bad)}
.cd.on{background:var(--ok)}
.chat{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
.msg{padding:8px 10px;border-radius:10px;margin:0 0 8px;max-width:88%;font-size:14px;background:var(--card);border:1px solid var(--line)}
.msg.me{margin-left:auto;background:var(--me);border-color:rgba(95,168,122,.2)}
.msg b{display:block;font-size:11px;color:var(--acc)}
.msg span{display:block;font-size:10px;color:var(--mute);margin-top:4px}
.inp{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#0a0b10}
.inp textarea{flex:1;background:#1a1c24;border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px;max-height:120px;resize:none}
.inp button{background:var(--ok);color:#0d0e14;border:0;border-radius:10px;padding:0 16px;font-weight:700;min-height:44px}
.empty,.err{color:var(--mute);padding:28px 16px;text-align:center}
.err{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 10px}
.field{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.field .k{width:110px;color:var(--mute);flex-shrink:0}
.caps{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cap{font-size:11px;border:1px solid rgba(90,138,196,.25);color:var(--acc);border-radius:999px;padding:3px 8px}
.raw{font:12px ui-monospace,monospace;padding:6px 10px;border-bottom:1px solid var(--line);color:#8a8578;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:none;border-top:1px solid var(--line);background:#0a0b10;padding:6px env(safe-area-inset-right) calc(6px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
.tabs button{flex:1;background:none;border:0;color:var(--mute);padding:10px 4px;font-size:11px}
.tabs button.on{color:var(--ok)}
.healthgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:720px){
  .side{display:none;position:absolute;inset:0 auto 52px 0;width:80%;max-width:280px;z-index:5}
  .side.open{display:block}
  .tabs{display:flex}
  .healthgrid{grid-template-columns:1fr}
  .bar .menu{display:inline-block}
}
@media(min-width:721px){ .bar .menu{display:none} }
.menu{background:none;border:0;color:var(--ink);font-size:20px;padding:0 8px 0 0}
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="gatebox">
    <h1>⚡ Fleet Hub</h1>
    <p>Operator token. Same one on every device. Stored in this browser only.</p>
    <input id="tok" type="password" placeholder="token" autocomplete="current-password">
    <button onclick="login()">Enter</button>
    <div class="err" id="gerr"></div>
  </div>
</div>
<div class="app" id="app">
  <div class="side" id="side">
    <h1>⚡ Fleet</h1>
    <div class="nav" id="nav">
      <div class="sec">Chat</div>
      <button class="on" data-v="group" onclick="go('group')">💬 Group</button>
      <div class="sec">Agents</div>
      <div class="sec">Views</div>
      <button data-v="health" onclick="go('health')">🫀 Health</button>
      <button data-v="nodes" onclick="go('nodes')">🗺 Nodes</button>
      <button data-v="raw" onclick="go('raw')">📡 Raw NATS</button>
      <button data-v="kanban" onclick="go('kanban')">📋 Kanban</button>
    </div>
  </div>
  <div class="main">
    <div class="bar">
      <span><button class="menu" onclick="toggleSide()">☰</button><b id="title">Group</b></span>
      <span><span class="cd" id="d"></span><span id="ds" style="font-size:11px;color:var(--mute)">…</span></span>
    </div>
    <div class="chat" id="content"></div>
    <div class="inp" id="inpbar" style="display:none">
      <textarea id="txt" placeholder="Message…" rows="1"></textarea>
      <button onclick="send()">Send</button>
    </div>
  </div>
</div>
<div class="tabs" id="tabs">
  <button class="on" onclick="go('group')">Chat</button>
  <button onclick="go('health')">Health</button>
  <button onclick="toggleSide()">Agents</button>
  <button onclick="go('nodes')">Nodes</button>
</div>
<script>
var B='/fleet', token=localStorage.getItem('fleet_token')||'', cur='group', curAgent=null, sse=null;
var roster={}, msgs={group:[],raw:[]}, amsgs={}, unseen=0;
var content=document.getElementById('content'), inpbar=document.getElementById('inpbar');
var txt=document.getElementById('txt'), titleEl=document.getElementById('title');
var d=document.getElementById('d'), ds=document.getElementById('ds');

function hdr(){return token?{'Authorization':'Bearer '+token,'Content-Type':'application/json'}:{'Content-Type':'application/json'}}
function rel(ts){
  if(!ts) return 'never';
  var t=Date.parse(ts); if(!t) return ts;
  var s=Math.max(0, (Date.now()-t)/1000);
  if(s<60) return Math.round(s)+'s ago';
  if(s<3600) return Math.round(s/60)+'m ago';
  if(s<86400) return Math.round(s/3600)+'h ago';
  return Math.round(s/86400)+'d ago';
}
async function api(path, opt){
  var r=await fetch(B+path, Object.assign({headers:hdr()}, opt||{}));
  if(r.status===401){ localStorage.removeItem('fleet_token'); token=''; showGate(); throw new Error('auth'); }
  return r.json();
}
function showGate(){ document.getElementById('gate').style.display='flex'; document.getElementById('app').style.display='none'; }
function showApp(){ document.getElementById('gate').style.display='none'; document.getElementById('app').style.display='flex'; }
async function login(){
  var t=document.getElementById('tok').value.trim();
  try{
    var r=await fetch(B+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:t})});
    if(!r.ok) throw new Error('bad token');
    token=t; localStorage.setItem('fleet_token', t); showApp(); boot();
  }catch(e){ document.getElementById('gerr').textContent='Bad token'; }
}
function toggleSide(){ document.getElementById('side').classList.toggle('open'); }

function paintNav(){
  var nav=document.getElementById('nav');
  nav.querySelectorAll('[data-agent]').forEach(function(el){el.remove()});
  var marker=null;
  nav.querySelectorAll('.sec').forEach(function(s){ if(s.textContent==='Views') marker=s; });
  Object.keys(roster).forEach(function(uid){
    var info=roster[uid];
    var b=document.createElement('button');
    b.dataset.v='agent:'+uid; b.dataset.agent='1';
    b.innerHTML='<span class="dot '+(info.status==='live'?'live':'')+'"></span>'+(info.display_name||uid);
    b.onclick=function(){ go('agent:'+uid); document.getElementById('side').classList.remove('open'); };
    marker?nav.insertBefore(b, marker):nav.appendChild(b);
  });
}
function setOn(v){
  document.querySelectorAll('.nav button').forEach(function(el){ el.classList.toggle('on', el.dataset.v===v); });
  document.querySelectorAll('.tabs button').forEach(function(el,i){
    var map=['group','health',null,'nodes'];
    el.classList.toggle('on', map[i]===v);
  });
}
function connect(ch){
  if(sse){try{sse.close()}catch(e){}}
  var url=B+'/events/'+encodeURIComponent(ch)+(token?('?token='+encodeURIComponent(token)):'');
  sse=new EventSource(url);
  sse.onopen=function(){ d.className='cd on'; ds.textContent='live'; };
  sse.onerror=function(){ d.className='cd'; ds.textContent='retry…'; };
  sse.onmessage=function(e){
    try{
      var ev=JSON.parse(e.data); if(ev.type==='connected') return;
      if(ch==='raw'){ msgs.raw.push(ev); if(cur==='raw') addRaw(ev); return; }
      var from=ev.from|| (ev.data&&ev.data.from) || 'system';
      var text=ev.text|| (ev.data&&(ev.data.text||ev.data.body)) || '';
      if(!text) return;
      var row={from:from,text:text,ts:ev.ts||ev.timestamp};
      if(ch==='group'){ msgs.group.push(row); if(cur==='group') addMsg(row, from==='operator'); }
      else if(ch.indexOf('agent:')===0){
        var uid=ch.split(':')[1]; (amsgs[uid]=amsgs[uid]||[]).push(row);
        if(cur===ch) addMsg(row, from==='operator');
      }
      if(document.hidden){ unseen++; notify(from, text); if(navigator.setAppBadge) navigator.setAppBadge(unseen); }
    }catch(x){}
  };
}
function notify(from, text){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  try{ new Notification(from||'Fleet', {body:String(text).slice(0,140), tag:'fleet'}); }catch(e){}
}
function addMsg(x, me){
  var div=document.createElement('div'); div.className='msg'+(me?' me':'');
  div.innerHTML='<b></b><div></div><span></span>';
  div.querySelector('b').textContent=x.from||'';
  div.querySelector('div').textContent=x.text||'';
  div.querySelector('span').textContent=rel(x.ts);
  content.appendChild(div); content.scrollTop=content.scrollHeight;
}
function addRaw(ev){
  var div=document.createElement('div'); div.className='raw';
  var data=ev.data||{};
  div.textContent='#'+(ev.seq||'—')+' '+(ev.subject||'')+' '+(data.from||'')+': '+String(data.text||data.body||data.kind||'').slice(0,120);
  content.appendChild(div); content.scrollTop=content.scrollHeight;
}
function renderMsgs(list){
  content.innerHTML='';
  if(!list.length){ content.innerHTML='<div class="empty">No messages yet.</div>'; return; }
  list.forEach(function(x){ addMsg(x, x.from==='operator'); });
}
async function go(v){
  cur=v; curAgent=null; setOn(v); if(sse){try{sse.close()}catch(e){}}
  inpbar.style.display='none';
  if(v==='group'){ titleEl.textContent='Group chat'; inpbar.style.display='flex'; renderMsgs(msgs.group); connect('group'); }
  else if(v==='raw'){ titleEl.textContent='Raw NATS'; content.innerHTML=''; msgs.raw.slice(-120).forEach(addRaw); if(!msgs.raw.length) content.innerHTML='<div class="empty">Waiting for traffic…</div>'; connect('raw'); }
  else if(v==='health'){ titleEl.textContent='Health'; await renderHealth(); }
  else if(v==='nodes'){ titleEl.textContent='Nodes'; await renderNodes(); }
  else if(v==='kanban'){ titleEl.textContent='Kanban'; await renderKanban(); }
  else if(v.indexOf('agent:')===0){
    curAgent=v.split(':')[1]; var info=roster[curAgent]||{};
    titleEl.textContent=info.display_name||curAgent;
    renderAgent(curAgent, info);
    inpbar.style.display='flex';
    connect(v);
  }
}
async function renderHealth(){
  try{
    var h=await api('/api/health'); var p=await api('/api/presence');
    var html='<div style="padding:12px">';
    html+='<div class="healthgrid">';
    html+='<div class="card"><b>Broker</b><div class="field"><div class="k">NATS</div><div>'+(h.broker.connected?'live':'down')+'</div></div>';
    html+='<div class="field"><div class="k">Stream</div><div>'+h.broker.stream+'</div></div>';
    html+='<div class="field"><div class="k">Msgs</div><div>'+h.broker.messages+' / seq '+h.broker.last_seq+'</div></div>';
    html+='<div class="field"><div class="k">Error</div><div>'+(h.broker.error||'—')+'</div></div></div>';
    html+='<div class="card"><b>Presence window</b><p style="color:var(--mute);font-size:12px;margin-top:6px">Live = last NATS activity ≤ '+(p.live_window_s||300)+'s. Dots are measured, not hardcoded.</p></div>';
    html+='</div>';
    Object.keys(p.agents||{}).forEach(function(uid){
      var a=p.agents[uid];
      html+='<div class="card"><span class="dot '+(a.status==='live'?'live':'')+'"></span> '+(a.display_name||uid)+' · '+a.status+' · last '+rel(a.last_seen)+'</div>';
    });
    html+='</div>';
    content.innerHTML=html;
    if('Notification' in window && Notification.permission==='default'){
      var b=document.createElement('button'); b.textContent='Enable notifications'; b.style.cssText='margin:12px;padding:10px 14px;border-radius:8px;border:0;background:#5fa87a;color:#0d0e14';
      b.onclick=function(){ Notification.requestPermission(); };
      content.appendChild(b);
    }
  }catch(e){ content.innerHTML='<div class="empty">Health unavailable.</div>'; }
}
async function renderNodes(){
  try{
    var n=await api('/api/nodes');
    content.innerHTML='<div style="padding:12px">'+(n.nodes||[]).map(function(x){
      return '<div class="card"><b>'+x.label+'</b><div class="field"><div class="k">Role</div><div>'+x.role+'</div></div>'
        +'<div class="field"><div class="k">Public</div><div>'+x.public+'</div></div>'
        +'<div class="field"><div class="k">Tailscale</div><div>'+x.tailscale+'</div></div></div>';
    }).join('')+'</div>';
  }catch(e){ content.innerHTML='<div class="empty">Nodes unavailable.</div>'; }
}
async function renderKanban(){
  try{
    var k=await api('/api/kanban'); var tasks=k.tasks||k||[];
    content.innerHTML='<div style="padding:12px">'+(tasks.length?tasks.map(function(t){
      return '<div class="card">'+(t.title||t.id||'')+' <span style="color:var(--mute)">['+(t.status||'')+']</span></div>';
    }).join(''):'<div class="empty">No live tasks. The July board is retired until an agent writes new ones.</div>')+'</div>';
  }catch(e){ content.innerHTML='<div class="empty">Kanban unavailable.</div>'; }
}
function renderAgent(uid, info){
  content.innerHTML='';
  var page=document.createElement('div'); page.style.padding='12px';
  page.innerHTML='<div class="card"><h2 style="margin-bottom:6px"></h2><div class="status"></div></div>';
  page.querySelector('h2').textContent=info.display_name||uid;
  page.querySelector('.status').innerHTML='<span class="dot '+(info.status==='live'?'live':'')+'"></span> '+(info.status||'offline')+' · last '+rel(info.last_seen);
  [['Role',info.role],['Host',info.host],['Tailscale',info.tailscale],['Subject',info.subject],['Model',info.model],['Provider',info.provider],['Meishi',info.meishi],['Callsign',info.callsign]].forEach(function(f){
    var row=document.createElement('div'); row.className='field';
    row.innerHTML='<div class="k"></div><div class="v"></div>';
    row.querySelector('.k').textContent=f[0]; row.querySelector('.v').textContent=f[1]||'—';
    page.querySelector('.card').appendChild(row);
  });
  if(info.bio){ var bio=document.createElement('p'); bio.style.cssText='color:var(--mute);margin-top:8px'; bio.textContent=info.bio; page.querySelector('.card').appendChild(bio); }
  if(info.capabilities){ var c=document.createElement('div'); c.className='caps'; info.capabilities.forEach(function(x){ var s=document.createElement('span'); s.className='cap'; s.textContent=x; c.appendChild(s); }); page.querySelector('.card').appendChild(c); }
  var h=document.createElement('div'); h.style.cssText='margin:14px 4px 8px;color:var(--mute);font-size:12px;text-transform:uppercase'; h.textContent='Direct messages';
  var box=document.createElement('div'); box.id='agent-chat-area';
  page.appendChild(h); page.appendChild(box);
  content.appendChild(page);
  (amsgs[uid]||[]).forEach(function(x){ addMsgTo(box,x,x.from==='operator'); });
}
function addMsgTo(area,x,me){
  var div=document.createElement('div'); div.className='msg'+(me?' me':'');
  div.innerHTML='<b></b><div></div><span></span>';
  div.querySelector('b').textContent=x.from||'';
  div.querySelector('div').textContent=x.text||'';
  div.querySelector('span').textContent=rel(x.ts);
  area.appendChild(div);
}
async function send(){
  var text=txt.value.trim(); if(!text) return;
  txt.value='';
  var body={from_:'operator',text:text,to:curAgent||'group'};
  try{
    var d=await api('/api/send',{method:'POST',body:JSON.stringify(body)});
    if(!d.ok) throw new Error(d.error||'send failed');
    var row={from:'operator',text:text,ts:new Date().toISOString()};
    if(cur==='group'){ msgs.group.push(row); addMsg(row,true); }
    else if(curAgent){ (amsgs[curAgent]=amsgs[curAgent]||[]).push(row); var area=document.getElementById('agent-chat-area'); if(area) addMsgTo(area,row,true); }
  }catch(e){ content.insertAdjacentHTML('beforeend','<div class="err">'+e.message+'</div>'); }
}
txt.addEventListener('keydown',function(e){ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); }});
document.addEventListener('visibilitychange',function(){ if(!document.hidden){ unseen=0; if(navigator.clearAppBadge) navigator.clearAppBadge(); }});

async function boot(){
  try{
    var r=await api('/api/roster'); roster=r.agents||{};
    paintNav();
    var c=await api('/api/chat'); msgs.group=(c.messages||[]).map(function(m){return {from:m.from,text:m.text,ts:m.ts};});
    go('group');
  }catch(e){ showGate(); }
}
if(token){ showApp(); boot(); } else { showGate(); }
</script>
</body>
</html>
